<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotating Cube</title><link rel="stylesheet" href="shared.css"><style>#cube{width:180px;height:180px;position:relative;transform-style:preserve-3d;transition:transform .35s ease}.face{width:180px;height:180px}.front{transform:translateZ(90px)}.back{transform:rotateY(180deg) translateZ(90px)}.right{transform:rotateY(90deg) translateZ(90px)}.left{transform:rotateY(-90deg) translateZ(90px)}.top{transform:rotateX(90deg) translateZ(90px)}.bottom{transform:rotateX(-90deg) translateZ(90px)}</style></head><body><main><a href="index.html">Back</a><h1>Rotating cube</h1><p>Six DOM faces form a true CSS 3D object.</p><div class="demo stage"><div id="cube"><div class="face front">Front</div><div class="face back">Back</div><div class="face right">Right</div><div class="face left">Left</div><div class="face top">Top</div><div class="face bottom">Bottom</div></div></div><div class="controls"><button id="l">Left</button><button id="r">Right</button><button id="u">Up</button><button id="d">Down</button></div><script type="module">import{Cube3D}from'../src/index.js';const c=new Cube3D(cube);l.onclick=()=>c.rotateBy(0,-90);r.onclick=()=>c.rotateBy(0,90);u.onclick=()=>c.rotateBy(-90,0);d.onclick=()=>c.rotateBy(90,0);</script></main></body></html>
