<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perspective Tilt</title><link rel="stylesheet" href="shared.css"></head><body><main><a href="index.html">Back</a><h1>Perspective tilt card</h1><p>Move the pointer across the card. Rotation, lift and shadow are all derived from pointer position.</p><div class="demo stage"><article id="tilt" class="card" style="width:min(430px,80%);min-height:280px"><div style="transform:translateZ(44px)"><div class="tag">Physical UI</div><h2 style="font-size:2rem">Depth should communicate hierarchy.</h2><p>This text sits on a raised plane while the card itself rotates in perspective.</p></div></article></div><script type="module">import{PerspectiveStage,TiltCard}from'../src/index.js';new PerspectiveStage(document.querySelector('.stage'),{perspective:850});new TiltCard(document.querySelector('#tilt'),{maxTilt:16,lift:24,shadow:52});</script></main></body></html>
