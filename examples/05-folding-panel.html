<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folding Panel</title><link rel="stylesheet" href="shared.css"></head><body><main><a href="index.html">Back</a><h1>Folding panel</h1><p>A panel is hinged at one edge, making disclosure feel like a physical object opening.</p><div class="demo stage"><div style="width:min(680px,88%);display:grid;grid-template-columns:1fr 1fr;transform-style:preserve-3d"><div class="card"><div class="tag">Base panel</div><h2>Project details</h2><p>The second panel is attached to this edge.</p></div><div id="fold" class="card" style="transform-origin:left center;background:#192236"><div class="tag">Foldable</div><h2>Secondary controls</h2><p>This entire DOM surface rotates around its hinge.</p></div></div></div><div class="controls"><button id="toggle">Toggle fold</button></div><script type="module">import{FoldPanel}from'../src/index.js';const f=new FoldPanel(fold,{axis:'y'});toggle.onclick=()=>f.toggle();</script></main></body></html>
