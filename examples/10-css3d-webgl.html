<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 3D and WebGL</title><link rel="stylesheet" href="shared.css"><style>canvas{width:300px;height:300px;display:block}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;width:min(760px,90%)}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style></head><body><main><a href="index.html">Back</a><h1>CSS 3D and optional WebGL</h1><p>Use DOM transforms for semantic interface surfaces. Use WebGL only when you need pixel or geometry rendering that CSS cannot provide efficiently.</p><div class="demo"><div class="pair"><article class="card stage" style="transform:rotateY(-10deg) rotateX(6deg)"><div class="tag">DOM</div><h2>Semantic CSS 3D</h2><p>Text remains selectable, accessible and easy to style.</p></article><article class="card"><div class="tag">WebGL</div><canvas id="gl"></canvas><p id="status">Starting WebGL...</p></article></div></div><div class="controls"><button id="toggle">Pause WebGL</button></div><script type="module">import{WebGLScene}from'../src/index.js';try{const scene=new WebGLScene(gl);scene.start();status.textContent='Raw WebGL triangle running.';let running=true;toggle.onclick=()=>{running=!running;running?scene.start():scene.stop();toggle.textContent=running?'Pause WebGL':'Resume WebGL';};}catch(error){status.textContent='WebGL unavailable. CSS 3D demo still works.';toggle.disabled=true;}</script></main></body></html>
